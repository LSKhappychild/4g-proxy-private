apiVersion: apps/v1
kind: Deployment
metadata:
  name: s1ap-proxy
  namespace: s1ap-proxy
  labels:
    app.kubernetes.io/name: s1ap-proxy
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s1ap-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s1ap-proxy
        app.kubernetes.io/component: proxy
    spec:
      containers:
      - name: s1ap-proxy
        image: s1ap-proxy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: s1ap
          containerPort: 36412
          protocol: SCTP
        - name: http-api
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: s1ap-proxy-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http-api
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http-api
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 1000
