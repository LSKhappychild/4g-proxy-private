apiVersion: v1
kind: Service
metadata:
  name: s1ap-proxy
  namespace: s1ap-proxy
  labels:
    app.kubernetes.io/name: s1ap-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: s1ap-proxy
  ports:
  - name: s1ap
    port: 36412
    targetPort: s1ap
    protocol: SCTP
  - name: http-api
    port: 8080
    targetPort: http-api
    protocol: TCP
---
